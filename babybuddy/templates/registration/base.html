{% extends "babybuddy/base.html" %}
{% load static widget_tweaks %}
{% block breadcrumb_nav %}{% endblock %}
{% block page %}
    <div id="view-{{ request.resolver_match.view_name }}" class="container py-4">
        <div class="ocean-auth-shell p-4">
            <div class="text-center pb-3">
                <span class="ocean-badge-pill mb-3">
                    <svg width="18" height="18" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                        <path d="M4 20 C4 11 13 7 23 9 C29 10 33 16 33 21 C33 25 26 28 16 28 C8 28 4 24 4 20 Z" fill="#38bdf8" />
                        <circle cx="11" cy="18" r="1.6" fill="#041224" />
                    </svg>
                    Ocean Theme
                </span>
                <div>
                    <img src="{% static "babybuddy/logo/icon-brand.png" %}"
                         width="65"
                         height="65"
                         class="d-inline-block align-top"
                         alt="">
                    <h1 class="d-none d-md-inline-block display-5 ms-2 mb-0 align-middle">
                        <span class="text-primary">Baby</span> Buddy
                    </h1>
                </div>
            </div>
            <div class="p-2 rounded text-light">
                {% include "babybuddy/messages.html" %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
{% endblock %}
